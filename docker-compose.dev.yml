name: lorekeeper-platform-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: lorekeeper
      POSTGRES_PASSWORD: lorekeeper
      POSTGRES_DB: lorekeeper_platform
    volumes:
      - postgres-dev:/var/lib/postgresql/data

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    restart: always
    ports: ["3567:3567"]
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://lorekeeper:lorekeeper@postgres/lorekeeper_platform"
      POSTGRESQL_TABLE_NAMES_PREFIX: "supertokens"
    depends_on: [postgres]

volumes:
  postgres-dev:
