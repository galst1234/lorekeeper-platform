[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]~=0.136",
    "supertokens-python~=0.31",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.31",
    "alembic~=1.18",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.14",
    "sentry-sdk~=2.61",
    "tenacity~=9.1.4",
    "opentelemetry-sdk~=1.42",
    "opentelemetry-exporter-otlp~=1.42",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
]

[dependency-groups]
dev = [
    "pytest~=9.0",
    "pytest-asyncio~=1.4",
    "httpx~=0.28",
    "ruff~=0.15",
    "ipython~=9.14",
    "ty>=0.0.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade — modernize syntax
    "B",    # flake8-bugbear — common bug patterns
    "SIM",  # flake8-simplify — suggest simpler alternatives
    "ANN",  # flake8-annotations — enforce type annotations
    "COM",  # flake8-commas — trailing commas
    "C4",   # flake8-comprehensions — cleaner comprehensions
    "Q",    # flake8-quotes — quote consistency
    "N",    # pep8-naming — naming conventions
    "RUF",  # Ruff-specific rules
    "C90",  # mccabe complexity
    "FAST", # FastAPI-specific rules
]
ignore = [
    "ANN401",  # allow typing.Any — needed for SDK callback types
    "COM812",  # trailing comma — conflicts with ruff formatter
    "B008",    # Depends() in defaults is the canonical FastAPI pattern
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ty.src]
include = ["src"]
