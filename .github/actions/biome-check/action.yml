name: Biome
description: Lint and format check with Biome

inputs:
  project-dir:
    description: Service directory
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ${{ inputs.project-dir }}/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: ${{ inputs.project-dir }}
    - run: npx biome check .
      shell: bash
      working-directory: ${{ inputs.project-dir }}
