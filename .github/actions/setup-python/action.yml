name: Setup Python
description: Install uv and sync project dependencies

inputs:
  project-dir:
    description: Service directory (api or agent)
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - run: uv sync --frozen
      shell: bash
      working-directory: ${{ inputs.project-dir }}
