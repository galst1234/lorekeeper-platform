name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      agent: ${{ steps.filter.outputs.agent }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            agent:
              - 'agent/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  ruff-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          project-dir: api
      - name: Run Ruff
        uses: ./.github/actions/ruff-check
        with:
          project-dir: api

  ty-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          project-dir: api
      - name: Run Ty
        uses: ./.github/actions/ty-check
        with:
          project-dir: api

  pytest-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lorekeeper
          POSTGRES_PASSWORD: lorekeeper
          POSTGRES_DB: lorekeeper_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          project-dir: api
      - name: Create test DB
        run: PGPASSWORD=lorekeeper psql -h localhost -U lorekeeper -d lorekeeper_platform -c "CREATE DATABASE lorekeeper_platform_test;"
      - name: Run Pytest
        uses: ./.github/actions/pytest-check
        with:
          project-dir: api
        env:
          DATABASE_URL: postgresql+asyncpg://lorekeeper:lorekeeper@localhost/lorekeeper_platform
          SUPERTOKENS_CONNECTION_URI: http://localhost:3567
          API_DOMAIN: http://localhost:8000
          WEBSITE_DOMAIN: http://localhost:5173

  ruff-agent:
    needs: detect-changes
    if: needs.detect-changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          project-dir: agent
      - name: Run Ruff
        uses: ./.github/actions/ruff-check
        with:
          project-dir: agent

  ty-agent:
    needs: detect-changes
    if: needs.detect-changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          project-dir: agent
      - name: Run Ty
        uses: ./.github/actions/ty-check
        with:
          project-dir: agent

  biome:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Biome
        uses: ./.github/actions/biome-check
        with:
          project-dir: frontend
