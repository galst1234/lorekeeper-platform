name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-api:
    if: (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/galst1234/lorekeeper-platform-api:latest
            ghcr.io/galst1234/lorekeeper-platform-api:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=registry,ref=ghcr.io/galst1234/lorekeeper-platform-api:buildcache
          cache-to: type=registry,ref=ghcr.io/galst1234/lorekeeper-platform-api:buildcache,mode=max

  build-agent:
    if: (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          tags: |
            ghcr.io/galst1234/lorekeeper-platform-agent:latest
            ghcr.io/galst1234/lorekeeper-platform-agent:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=registry,ref=ghcr.io/galst1234/lorekeeper-platform-agent:buildcache
          cache-to: type=registry,ref=ghcr.io/galst1234/lorekeeper-platform-agent:buildcache,mode=max

  build-frontend:
    if: (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/galst1234/lorekeeper-platform-frontend:latest
            ghcr.io/galst1234/lorekeeper-platform-frontend:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=registry,ref=ghcr.io/galst1234/lorekeeper-platform-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/galst1234/lorekeeper-platform-frontend:buildcache,mode=max

  deploy:
    needs: [build-api, build-agent, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer redeploy
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
